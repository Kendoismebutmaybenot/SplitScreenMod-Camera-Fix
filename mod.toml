name = "Split-Screen Mod"
description = "Adds support for 4-player split-screen to the game"

[preload]
packages = [
    # Skeletons
    "PDLCIN_B3_Anim2",
]
keep_alive = [
    # Skeletons
    "Skeletons.Mesh.Batman_Skeleton_Skin",
]

[options]
layout_horizontal = true # Whether 2P split screen should prefer a horizontal split
letterboxing = false # Black bars around 2P views (true) or fill each half with a wider, unstretched view (false)
letterbox_aspect = 1.7778 # Shape of each letterboxed 2P view (1.7778 = 16:9 unstretched, 2.3333 = 21:9 slightly stretched)
players = [
    [
        "Playable_RobinStoryDLC",
        "Std",
    ],
    [
        "Playable_Catwoman",
        "Std",
    ],
    [
        "Playable_Nightwing",
        "Std",
    ],
]
